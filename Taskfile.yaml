version: '3'

tasks:
  # Render all .excalidraw diagram sources to PNG (or pass names: task render -- foo bar)
  render:
    desc: Render docs/assets/diagrams/*.excalidraw to PNG
    cmds:
      - ./misc/diagrams/render-all.sh {{.CLI_ARGS}}

  # Print the resolved docs version (git tag or main:<sha>)
  version:
    desc: Print the docs version (same tag logic as the pipelines)
    cmds:
      - ./misc/version.sh

  # Live preview at http://127.0.0.1:8000 (version baked into footer)
  serve:
    desc: Serve the docs locally with live reload
    cmds:
      - ./misc/mkdocs-build.sh serve

  # What CI runs: fail on broken links / nav (version baked into footer)
  check:
    desc: Build the site with --strict (CI gate)
    cmds:
      - ./misc/mkdocs-build.sh

  build:
    desc: Build the runtime container image
    cmds:
      - docker build . --build-arg DOCS_VERSION="$(./misc/version.sh)" -t metahub-docs

  git:*:
    vars:
      GCMD: '{{index .MATCH 0}}'
    cmds:
      - git commit -{{.GCMD}} {{.CLI_ARGS}}
      - git push
