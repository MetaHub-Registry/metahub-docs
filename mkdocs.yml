site_name: MetaHub Docs
site_description: >-
  Profile-aware container image registry — demo walkthroughs for small images,
  layer manipulations, and ORAS artefacts.
site_url: https://docs.metahub-registry.org/
docs_dir: docs
site_dir: site

# Footer shows the build version, resolved by misc/version.sh using the same
# git-tag logic as the GoCD pipelines (exact tag -> tag, else main:<sha>).
# Injected at build time via the MKDOCS_VERSION env var.
copyright: !ENV [MKDOCS_COPYRIGHT, "MetaHub Docs"]

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    # Copy button on by default; output/session blocks (console transcripts,
    # json output) opt out per block with `{ .console .no-copy }` so the copy
    # symbol only appears on blocks with no output.
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search
  - macros

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Demo:
      - Small Images: small-images.md
      - Manipulations: manipulations.md
      - ORAS Artefacts: oras-artefacts.md
      - Model Injection: models.md
      - "Showcase: MiniCPM5-1B": minicpm5.md
  - Pull-Through Cache: pull-through-cache.md
  - Profile Resolution: profile-resolution.md
  - Reference:
      - Profile Extension v1: profile-spec.md
      - Trust Model: trust-model.md
      - API: api.md
  - Agent Environment: outfitter.md
  - Waldur Integration: waldur-integration.md

extra:
  # Build version (git tag or main:<sha>), injected by misc/mkdocs-build.sh.
  version: !ENV [MKDOCS_VERSION, "dev"]
  registry: !ENV [METAHUB_REGISTRY, "metahub-registry.org"]

# Fail the build on broken internal links / nav (CI runs `mkdocs build --strict`).
strict: true
